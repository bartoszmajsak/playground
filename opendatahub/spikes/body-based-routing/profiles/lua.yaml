                  # Pure Lua using handle:body(), no json_to_metadata.
                  # Works, but body() suspends the script until the WHOLE body
                  # is buffered - same ceiling as the metadata filter - and the
                  # JSON "parse" is a regex, since Envoy's Lua has no cjson.
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(handle)
                            handle:headers():remove("x-gateway-model-name")
                            local ct = handle:headers():get("content-type")
                            if ct and string.find(ct, "application/json", 1, true) then
                              local body = handle:body()
                              if body and body:length() > 0 then
                                local s = body:getBytes(0, body:length())
                                local model = string.match(s, '"model"%s*:%s*"([^"]*)"')
                                if model then
                                  handle:headers():add("x-gateway-model-name", model)
                                end
                              end
                            end
                            handle:clearRouteCache()
                          end
