# Controls for the runtime LoRA endpoints. Both were measured; neither is
# sufficient alone.
#
# The endpoints are unauthenticated, mutate a running server, and sit on the
# same port as inference. That last part rules out anything working at L4 alone.
#
# Layer 1, gateway: an ALLOW list of inference paths. Everything else, including
# the admin endpoints, is refused - load, both adapter registration forms and
# delete return 403, while inference and the model listing are unaffected.
#
# ALLOW rather than DENY. Istio path matching supports a wildcard at one end
# only, so a DENY pattern like "*/adapters/*" never matches: it applies cleanly,
# reports no error, and the request it was meant to block still succeeds. An
# allow list fails closed - a path nobody anticipated is refused, not permitted.
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-inference-only
  namespace: kserve
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kserve-ingress-gateway
  action: ALLOW
  rules:
    - to:
        - operation:
            paths:
              - "*/v1/chat/completions"
              - "*/v1/completions"
              - "*/v1/responses"
              - "*/v1/messages"
              - "*/v1/models"
              - "*/health"
              - "*/metrics"
---
# Layer 2, network: the gateway policy covers only traffic through the gateway.
# A pod reaching the workload Service directly bypasses it entirely. This
# restricts who can open a connection at all; inference is unaffected.
#
# It cannot distinguish inference from administration, since both are port 8000.
# It limits reachability; the gateway policy limits paths. Neither substitutes
# for the other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workload-ingress
  namespace: dynamic-lora
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: svc-dyn
  policyTypes: [Ingress]
  ingress:
    - from:
        # the gateway
        - namespaceSelector:
            matchLabels:
              name: kserve
        # the endpoint picker, which scrapes metrics and scores endpoints
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: svc-dyn
      ports:
        - port: 8000
