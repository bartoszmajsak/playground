# Keep the runtime LoRA endpoints off the gateway and reachable only by an
# in-cluster component that manages adapters.
#
# The endpoints are unauthenticated, mutate a running server, and share port
# 8000 with inference, so no L4 control separates them. They are also not routed
# deliberately: the route enumerates the inference paths and sends them to the
# InferencePool, and the admin paths arrive only through the catch-all rules
# that exist to forward health, metrics and the model listing to the workload.
# Exposure is incidental.
#
# Two layers, and they answer different questions.
#
# Gateway - an ALLOW list of inference paths, so nothing administrative is
# reachable from outside the cluster at all. Verified: load and delete return
# 403 through the gateway while inference and the model listing are unaffected.
#
# ALLOW rather than DENY. Istio path matching supports a wildcard at one end
# only, so a DENY pattern like "*/adapters/*" never matches: it applies cleanly,
# reports no error, and the request it was meant to block still succeeds. An
# allow list fails closed - a path nobody anticipated is refused, not permitted.
#
# Network - the gateway policy covers only traffic through the gateway, so this
# decides who inside the cluster may open a connection. The label below is the
# grant. Verified: a pod carrying it loads an adapter; a pod without it times
# out; and an adapter loaded that way is immediately servable through the
# gateway, since inference and administration are separate paths, not separate
# servers.
#
# Where the component managing adapters should live is undecided. This says only
# what it needs: a label, and network reach to port 8000.

---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-inference-only
  namespace: kserve
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kserve-ingress-gateway
  action: ALLOW
  rules:
    - to:
        - operation:
            paths:
              - "*/v1/chat/completions"
              - "*/v1/completions"
              - "*/v1/responses"
              - "*/v1/messages"
              - "*/v1/models"
              - "*/health"
              - "*/metrics"
---
# Layer 2, network: the gateway policy covers only traffic through the gateway.
# A pod reaching the workload Service directly bypasses it entirely. This
# restricts who can open a connection at all; inference is unaffected.
#
# It cannot distinguish inference from administration, since both are port 8000.
# It limits reachability; the gateway policy limits paths. Neither substitutes
# for the other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workload-ingress
  namespace: dynamic-lora
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: svc-dyn
  policyTypes: [Ingress]
  ingress:
    - from:
        # the gateway, for inference
        - namespaceSelector:
            matchLabels:
              name: kserve
        # the endpoint picker, which scrapes metrics and scores endpoints
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: svc-dyn
        # whatever manages adapters. Carrying this label is the grant; nothing
        # else in the cluster can reach the port.
        - podSelector:
            matchLabels:
              serving.kserve.io/adapter-manager: "true"
      ports:
        - port: 8000
