# On-demand LoRA fixture: adapters live in a PVC, nothing is declared in spec.
#
# TEMPLATE, not a manifest you apply directly. setup.sh composes the applyable
# version by splicing manifests/route-rules.yaml into
# spec.router.route.http.spec below. Applying this file as-is leaves the service
# with no route rules at all.
#
# The point of this shape is that spec.model.lora is ABSENT. kserve's
# attachLoRAAdapters returns early at len(adapters)==0 (workload_lora.go:148),
# so the controller injects neither --enable-lora nor a PVC mount. Both are
# supplied here by hand:
#
#   --enable-lora   via VLLM_ADDITIONAL_ARGS, which the llm preset interpolates
#                   into its `eval exec vllm serve ... ${VLLM_ADDITIONAL_ARGS}`
#   the PVC         via spec.template volumes/volumeMounts at /mnt/lora
#
# plus VLLM_ALLOW_RUNTIME_LORA_UPDATING=1, which is what makes vLLM register
# /v1/load_lora_adapter, /v1/unload_lora_adapter, POST /adapters and
# DELETE /adapters/{name}. Without it those four paths do not exist at all --
# and turning it on takes /openapi.json from 22 paths to 26.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynlora-models
  namespace: dynamic-lora
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: svc-dyn
  namespace: dynamic-lora
spec:
  model:
    uri: hf://hmellor/tiny-random-LlamaForCausalLM
    name: model-dyn
    # NO lora block. Every adapter arrives through an admin call at runtime.
  replicas: 1
  router:
    scheduler: {}
    gateway: {}
    route:
      http:
        # setup.sh splices manifests/route-rules.yaml in here -- rules captured
        # verbatim from a kserve-managed route for N adapters. Supplying them
        # inline keeps the managed gateway and leaves kserve owning the
        # HTTPRoute; it just stops deriving the rules from spec.model.lora,
        # because there is none.
        #
        # So the route indexes model-dyn + adapter-1..N permanently while the
        # runtime starts empty. Regenerate with hack/capture-route.sh.
        spec:
          rules: []
  template:
    volumes:
      - name: lora-store
        persistentVolumeClaim:
          claimName: dynlora-models
    containers:
      - name: main
        image: vllm/vllm-openai-cpu:v0.19.0
        # The preset sets runAsNonRoot: true for its CUDA image; the CPU image
        # runs as root, so kubelet refuses the container without this.
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
          - name: lora-store
            mountPath: /mnt/lora
        env:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "1"
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          # --max-loras is NOT emitted by kserve unless LoRASpec.MaxAdapters is
          # set, and vLLM's own default is 1 -- so without this the runtime
          # keeps a single adapter resident and swaps between them.
          - name: VLLM_ADDITIONAL_ARGS
            value: "--enable-lora --max-loras=4"
          - name: VLLM_ALLOW_RUNTIME_LORA_UPDATING
            value: "1"
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "8", memory: 12Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        startupProbe:
          httpGet: { path: /health, port: 8000 }
          periodSeconds: 10
          failureThreshold: 60
