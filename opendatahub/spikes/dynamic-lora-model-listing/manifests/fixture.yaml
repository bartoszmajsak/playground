# On-demand LoRA fixture: adapters live in a PVC, nothing is declared in spec.
#
# The point of this shape is that spec.model.lora is ABSENT. kserve's
# attachLoRAAdapters returns early at len(adapters)==0 (workload_lora.go:148),
# so the controller injects neither --enable-lora nor a PVC mount. Both are
# supplied here by hand:
#
#   --enable-lora   via VLLM_ADDITIONAL_ARGS, which the llm preset interpolates
#                   into its `eval exec vllm serve ... ${VLLM_ADDITIONAL_ARGS}`
#   the PVC         via spec.template volumes/volumeMounts at /mnt/lora
#
# plus VLLM_ALLOW_RUNTIME_LORA_UPDATING=1, which is what makes vLLM register
# /v1/load_lora_adapter, /v1/unload_lora_adapter, POST /adapters and
# DELETE /adapters/{name}. Without it those four paths do not exist at all.
#
# The route is supplied too -- see route.yaml and spec.router.route.http.refs
# below. A user-supplied ref means kserve does not generate its own route, and
# odh-model-controller still attaches an AuthPolicy per ref
# (kserve_authpolicy_reconciler.go getHTTPRouteNames iterates every ref).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynlora-models
  namespace: dynamic-lora
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: svc-dyn
  namespace: dynamic-lora
spec:
  model:
    uri: hf://hmellor/tiny-random-LlamaForCausalLM
    name: model-dyn
    # NO lora block. Every adapter arrives through an admin call at runtime.
  replicas: 1
  router:
    scheduler: {}
    gateway: {}
    route:
      http:
        # Rules captured VERBATIM from the kserve-managed route for 4 adapters,
        # by hack/capture-route.sh. Supplying them inline via http.spec keeps the
        # managed gateway and leaves kserve owning the HTTPRoute; it just stops
        # deriving the rules from spec.model.lora, because there is none.
        #
        # The route therefore indexes model-dyn + adapter-1..4 permanently while
        # the runtime starts empty. Do not hand-edit -- re-run capture-route.sh.
        spec:
          rules:
          - backendRefs:
            - group: inference.networking.x-k8s.io
              kind: InferencePool
              name: svc-dyn-inference-pool
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/completions
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /dynamic-lora/svc-dyn/v1/completions
            name: v1-completions-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.x-k8s.io
              kind: InferencePool
              name: svc-dyn-inference-pool
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/chat/completions
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /dynamic-lora/svc-dyn/v1/chat/completions
            name: v1-chat-completions-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.x-k8s.io
              kind: InferencePool
              name: svc-dyn-inference-pool
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/responses
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /dynamic-lora/svc-dyn/v1/responses
            name: v1-responses-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.x-k8s.io
              kind: InferencePool
              name: svc-dyn-inference-pool
              port: 8000
              weight: 1
            filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  replacePrefixMatch: /v1/messages
                  type: ReplacePrefixMatch
            matches:
            - path:
                type: PathPrefix
                value: /dynamic-lora/svc-dyn/v1/messages
            name: v1-messages-path
            timeouts:
              backendRequest: 0s
              request: 0s
          - backendRefs:
            - group: inference.networking.x-k8s.io
              kind: InferencePool
              name: svc-dyn-inference-pool
              port: 8000
              weight: 1
            matches:
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/model-dyn
              path:
                type: Exact
                value: /v1/completions
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/model-dyn
              path:
                type: Exact
                value: /v1/completions/
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/model-dyn
              path:
                type: Exact
                value: /v1/chat/completions
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/model-dyn
              path:
                type: Exact
                value: /v1/chat/completions/
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/model-dyn
              path:
                type: Exact
                value: /v1/responses
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/model-dyn
              path:
                type: Exact
                value: /v1/responses/
            - headers:
              - name: X-Gateway-Model-Name
