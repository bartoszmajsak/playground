              path:
                type: Exact
                value: /v1/messages
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/model-dyn
              path:
                type: Exact
                value: /v1/messages/
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/adapter-1
              path:
                type: Exact
                value: /v1/completions
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/adapter-2
              path:
                type: Exact
                value: /v1/completions
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/adapter-3
              path:
                type: Exact
                value: /v1/completions
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/adapter-4
              path:
                type: Exact
                value: /v1/completions
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/adapter-1
              path:
                type: Exact
                value: /v1/completions/
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/adapter-2
              path:
                type: Exact
                value: /v1/completions/
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/adapter-3
              path:
                type: Exact
