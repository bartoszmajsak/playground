              path:
                type: Exact
                value: /v1/responses/
            - headers:
              - name: X-Gateway-Model-Name
                type: Exact
                value: publishers/dynamic-lora/models/adapter-1
              path:
                type: Exact
                value: /v1/messages
            - headers:
              - name: X-Gateway-Model-Name
