  template:
    volumes:
      - name: lora-store
        persistentVolumeClaim:
          claimName: dynlora-models
    containers:
      - name: main
        image: vllm/vllm-openai-cpu:v0.19.0
        # The preset sets runAsNonRoot: true for its CUDA image; the CPU image
        # runs as root, so kubelet refuses the container without this.
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
          - name: lora-store
            mountPath: /mnt/lora
        env:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "1"
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: VLLM_ADDITIONAL_ARGS
            value: "--enable-lora --max-loras=4"
          - name: VLLM_ALLOW_RUNTIME_LORA_UPDATING
            value: "1"
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "8", memory: 12Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        startupProbe:
          httpGet: { path: /health, port: 8000 }
          periodSeconds: 10
          failureThreshold: 60
