# LLMInferenceService fixtures for tier 1 (route capture).
#
# Tier 1 only needs the controller to emit HTTPRoutes -- the route is the
# artifact and reconcileRouter builds it from the merged spec regardless of
# workload health. The EPP probe set needs more: a workload the InferencePool
# can actually select and the EPP can score. So:
#
#   * pvc:// everywhere, backed by one empty PVC. No downloads, no network.
#   * the workload is llm-d-inference-sim -- the same simulator GIE tests
#     against. It serves /health (so the readiness probe passes and the pool
#     gets endpoints), /metrics in vLLM format (so the EPP can scrape and
#     score), and the qualified model names the route matches on.
#   * command is wrapped in sh -c so the --enable-lora / --lora-modules args
#     kserve prepends land as positional params and are ignored -- they are
#     bash-eval-quoted for the real vLLM entrypoint and would not survive
#     being passed as argv.
#
# What each fixture pins:
#   svc-a  the normal case: 2 LoRA adapters, so expandLoRAAdapterMatches runs
#   svc-b  a second tenant on the same gateway, for cross-service probes
#   svc-c  model-based routing switched off, so stripModelBasedRoutingRules runs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lora-budget-models
  namespace: lora-budget
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: svc-a
  namespace: lora-budget
spec:
  model:
    uri: hf://hmellor/tiny-random-LlamaForCausalLM
    name: model-a
    lora:
      adapters:
        # Generated to match tiny-random-LlamaForCausalLM's dimensions
        # (hidden 16, 2 layers, q/v_proj out 256) at rank 8, ~35 KB each.
        # lora_B is zeros -- standard PEFT init, and a mathematical no-op, which
        # is what a routing test wants: the adapter must load and be addressable,
        # not change the output. See hack/gen-tiny-lora.py.
        - name: adapter-a1
          uri: pvc://lora-budget-models/adapter-a1
        - name: adapter-a2
          uri: pvc://lora-budget-models/adapter-a2
  replicas: 1
  router:
    scheduler: {}
    route: {}
    gateway: {}
  template:
    containers:
      # No command override: svc-a runs the preset's own vLLM entrypoint, so the
      # --served-model-name and --lora-modules kserve generates are exactly what
      # a real deployment gets. That is the point of using real vLLM here -- the
      # simulator would answer the EPP question identically (the EPP rejects
      # bodyless requests before it ever selects an endpoint) but it cannot
      # prove a real adapter resolves end-to-end.
      - name: main
        image: vllm/vllm-openai-cpu:v0.19.0
        # The preset sets runAsNonRoot: true, which suits the CUDA image it
        # ships with. vllm-openai-cpu runs as root, so kubelet refuses the
        # container outright. Spike-local override; not a finding.
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        env:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "1"
          - name: VLLM_LOGGING_LEVEL
            value: INFO
        resources:
          requests: { cpu: "2", memory: 4Gi }
          limits: { cpu: "8", memory: 12Gi }
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        startupProbe:
          httpGet: { path: /health, port: 8000 }
          periodSeconds: 10
          failureThreshold: 60
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: svc-b
  namespace: lora-budget
spec:
  model:
    uri: pvc://lora-budget-models/base
    name: model-b
  replicas: 1
  router:
    scheduler: {}
    route: {}
    gateway: {}
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
        command:
          - /bin/sh
          - -c
          - |
            exec /app/llm-d-inference-sim \
              --model model-b \
              --served-model-name model-b publishers/lora-budget/models/model-b \
              --port 8000
        resources:
          requests: { cpu: 20m, memory: 64Mi }
---
# The per-service lever for model-based routing is
# spec.annotations["serving.kserve.io/model-based-routing-enabled"], which the
# well-known kserve-config-llm-template preset sets to "true". Whether a CR
# value overrides the preset depends on merge direction, which is exactly the
# kind of thing a characterization test should observe rather than assume --
# capture-routes.sh asserts on the generated rule set and says which way it
# actually resolved.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: svc-c
  namespace: lora-budget
spec:
  annotations:
    serving.kserve.io/model-based-routing-enabled: "false"
  model:
    uri: pvc://lora-budget-models/base
    name: model-c
  replicas: 1
  router:
    scheduler: {}
    route: {}
    gateway: {}
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
        command:
          - /bin/sh
          - -c
          - |
            exec /app/llm-d-inference-sim \
              --model model-c \
              --served-model-name model-c publishers/lora-budget/models/model-c \
              --port 8000
        resources:
          requests: { cpu: 20m, memory: 64Mi }
---
# svc-ai exists purely to test prefix anchoring. Its qualified model name
# `publishers/lora-budget/models/model-a-instruct` STARTS WITH svc-a's
# `publishers/lora-budget/models/model-a`, so a nested-naming regex of the form
# `publishers/ns/models/model-a(/.*)?` must NOT capture it. If the data plane
# matches header regexes unanchored, it will -- and that is cross-service
# traffic capture, which is the whole risk of the nested scheme.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: svc-ai
  namespace: lora-budget
spec:
  model:
    uri: pvc://lora-budget-models/base
    name: model-a-instruct
  replicas: 1
  router:
    scheduler: {}
    route: {}
    gateway: {}
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
        command:
          - /bin/sh
          - -c
          - |
            exec /app/llm-d-inference-sim \
              --model model-a-instruct \
              --served-model-name model-a-instruct publishers/lora-budget/models/model-a-instruct \
              --port 8000
        resources:
          requests: { cpu: 20m, memory: 64Mi }
