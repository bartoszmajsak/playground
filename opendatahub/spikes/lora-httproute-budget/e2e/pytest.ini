[pytest]
testpaths = tests
markers =
    routing_strategy_mutation: mutates the cluster-global LoRA routing strategy; strictly serial phase
    routing_strategy_readonly: does not mutate global state; may parallelize
    smoke: fast development profile
    shape: route shape and negative-identity assertions
    transitions: strategy transition and fan-out scenarios
    budget: budget/fail-early scenarios
    capacity: full 100-adapter qualification
addopts = -p no:cacheprovider
