# Registers the spike's LLMInferenceService with MaaS so the gateway
# AuthPolicy admits requests for it: the rego rule requires a subscription
# that allows the model, and the model is discovered through MaaSModelRef.
#
# Placeholders: LLMISVCNAME_ NAMESPACE_ SUBSCRIPTIONNAMESPACE_
#
# The token budget is deliberately large: the installer's fixture allows 100
# tokens/min, which a twenty-request run exhausts.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: LLMISVCNAME_
  namespace: NAMESPACE_
spec:
  modelRef:
    kind: LLMInferenceService
    name: LLMISVCNAME_
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: epp-spike-LLMISVCNAME_
  namespace: SUBSCRIPTIONNAMESPACE_
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: LLMISVCNAME_
      namespace: NAMESPACE_
      tokenRateLimits:
        - limit: 1000000
          window: 1m
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: epp-spike-LLMISVCNAME_-access
  namespace: SUBSCRIPTIONNAMESPACE_
spec:
  modelRefs:
    - name: LLMISVCNAME_
      namespace: NAMESPACE_
  subjects:
    groups:
      - name: system:authenticated
    users: []
